syntax = "proto3";

option csharp_namespace = "AH.IdentityService";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

package user_service;

// The User service definition
service UserServiceRpc {
  // Get or create user (matched by email) after a successful external sign-in
  rpc GetOrCreateUser (GetUserRequest) returns (GetUserReply);
  // Get a user by internal id
  rpc GetUser (GetUserByIdRequest) returns (GetUserReply);
  // Update the user-editable profile fields
  rpc UpdateUserProfile (UpdateUserProfileRequest) returns (GetUserReply);
}

message GetUserRequest {
  string email = 1;
  string first_name = 2;
  google.protobuf.StringValue last_name = 3;
  google.protobuf.StringValue avatar_url = 4;
}

message GetUserByIdRequest {
  int32 id = 1;
}

message UpdateUserProfileRequest {
  int32 id = 1;
  string first_name = 2;
  string last_name = 3;
}

// Canonical "full user" reply shape, reused by GetOrCreateUser, ...
message GetUserReply {
  int32 id = 1;
  string email = 2;
  string first_name = 3;
  google.protobuf.StringValue last_name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.StringValue avatar_url = 6;
  // Unset until the user picks a language.
  google.protobuf.StringValue preferred_language = 7;
}
